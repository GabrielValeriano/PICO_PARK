<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pico Park - Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000080; 
            font-family: 'Arial Black', sans-serif; 
        }
        #lobby, #pause-menu { 
            position: absolute; width: 100%; height: 100%; top:0; left:0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10; 
        }
        #pause-menu { background: rgba(0,0,0,0.8); display: none; z-index: 30; }
        #gameCanvas { 
            position: absolute; top:0; left:0;
            display: none; z-index: 20; 
            background: #0d1117; 
        }
        h1 { color: white; font-size: 80px; margin: 0; text-shadow: 4px 4px #000; }
        .btn-indicator { background: #ff0000; color: white; padding: 10px 20px; border-radius: 5px; margin-bottom: 20px; font-size: 30px; animation: blink 1s infinite; }
        .menu-option { font-size: 40px; color: white; margin: 15px; opacity: 0.3; transition: 0.2s; }
        .menu-option.active { opacity: 1; transform: scale(1.2); color: #00ff00; }
        #qr-canvas { background: white; padding: 10px; border-radius: 10px; border: 5px solid #fff; margin-bottom: 15px; }
        #ip-display { color: #ffcc00; font-size: 40px; margin: 0; text-shadow: 2px 2px #000; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div id="lobby">
        <h1>PICO PARK</h1>
        <div class="btn-indicator">Esperando Jugadores...</div>
        <canvas id="qr-canvas"></canvas>
        <h2 id="ip-display">Cargando IP...</h2>
    </div>

    <div id="pause-menu">
        <h1 style="color: #ffcc00;">PAUSA</h1>
        <div id="opt-0" class="menu-option active">REANUDAR</div>
        <div id="opt-1" class="menu-option">SALIR A LOBBY</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let players = {}, gameState = 'LOBBY', selectedOption = 0, groundY;

    function resize() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        groundY = canvas.height - 150;
    }
    window.addEventListener('resize', resize); resize();

    const socket = new WebSocket('ws://' + window.location.hostname + ':3000');

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'server_info') {
            QRCode.toCanvas(document.getElementById('qr-canvas'), `ws://${data.ip}:3000`, { width: 250 });
            document.getElementById('ip-display').innerText = `IP: ${data.ip}`;
        }

        if (data.type === 'game_state') {
            gameState = data.state;
            document.getElementById('lobby').style.display = (gameState === 'LOBBY') ? "flex" : "none";
            document.getElementById('pause-menu').style.display = (gameState === 'PAUSED') ? 'flex' : 'none';
            canvas.style.display = (gameState !== 'LOBBY') ? 'block' : 'none';

            // FIX: Reset de velocidades al entrar al juego
            if (gameState === 'PLAYING') {
                Object.keys(players).forEach(id => { players[id].dx = 0; players[id].dy = 0; });
            }
        }

        if (data.type === 'new_player') {
            players[data.id] = { x: 100 + (data.id * 120), y: groundY, size: 50, color: data.color, dx: 0, dy: 0 };
        }

        if (data.type === 'remove_player') delete players[data.id];

        if (data.type === 'cmd') {
            // Lógica de navegación en Pausa
            if (gameState === 'PAUSED' && data.id === data.pausedBy) {
                if (data.command === 'UP') selectedOption = 0;
                if (data.command === 'DOWN') selectedOption = 1;
                document.getElementById('opt-0').className = `menu-option ${selectedOption === 0 ? 'active' : ''}`;
                document.getElementById('opt-1').className = `menu-option ${selectedOption === 1 ? 'active' : ''}`;
                if (data.command === 'CONFIRM_MENU') {
                    if (selectedOption === 0) socket.send(JSON.stringify({ type: 'request_resume' }));
                    else { socket.send(JSON.stringify({ type: 'request_lobby_reset' })); setTimeout(() => location.reload(), 50); }
                }
            }

            // Movimiento: Solo si el juego está en marcha (FIX SALTO)
            if (players[data.id] && gameState === 'PLAYING') {
                const p = players[data.id];
                let visualFloorTop = groundY + 50;
                if (data.command === 'LEFT_START') p.dx = -8;
                if (data.command === 'RIGHT_START') p.dx = 8;
                if (data.command === 'LEFT_STOP' || data.command === 'RIGHT_STOP') p.dx = 0;
                if (data.command === 'JUMP' && p.y + p.size >= visualFloorTop) p.dy = -18;
            }
        }
    };

    socket.onopen = () => socket.send(JSON.stringify({ type: 'is_game' }));

    function update() {
        if (canvas.style.display === 'block') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#2d5a27"; // Suelo Verde
            ctx.fillRect(0, groundY + 50, canvas.width, canvas.height);

            Object.keys(players).forEach(id => {
                let p = players[id];
                if (gameState === 'PLAYING') {
                    p.x += p.dx; p.y += p.dy;
                    p.dy += 0.8; // Gravedad

                    // Paredes y Límites
                    if (p.x < 0) p.x = 0;
                    if (p.x + p.size > canvas.width) p.x = canvas.width - p.size;
                    if (p.y < 0) { p.y = 0; p.dy = 0; }
                    if (p.y + p.size >= groundY + 50) { p.y = (groundY + 50) - p.size; p.dy = 0; }
                }
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.fillStyle = "white"; // Ojos
                ctx.fillRect(p.x + 10, p.y + 10, 8, 8); ctx.fillRect(p.x + 32, p.y + 10, 8, 8);
            });
        }
        requestAnimationFrame(update);
    }
    update();
</script>
</body>
</html>
