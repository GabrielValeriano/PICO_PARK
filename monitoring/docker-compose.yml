# Monitoreo de la VM y de los contenedores (actividad 07).
# Separado del compose del juego: si el monitoreo falla, el juego no se entera.
# La VM es compartida (hay otros Prometheus/Grafana): nombres con prefijo picopark- y puertos propios.
#
# Levantar (desde la raíz del repo):
#   GRAFANA_ADMIN_PASSWORD=... docker compose -f monitoring/docker-compose.yml up -d
name: picopark-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Métricas del host: CPU, memoria, disco y red de la VM.
  # Usa la red del host para ver las interfaces reales de la VM (no las del contenedor).
  node-exporter:
    image: prom/node-exporter:latest
    container_name: picopark-node-exporter
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9101
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging: *logging

  # Métricas por contenedor: CPU, memoria, red y reinicios de cada contenedor Docker.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: picopark-cadvisor
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    logging: *logging

  # Recolecta y guarda las métricas. Retención limitada para no volver a llenar el disco.
  prometheus:
    image: prom/prometheus:latest
    container_name: picopark-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "9091:9090"   # 9090 ya lo usa otro Prometheus de la VM
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para llegar al node-exporter y al servidor del juego
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    logging: *logging

  # Dashboards. El datasource y el dashboard se cargan solos (provisioning).
  grafana:
    image: grafana/grafana:latest
    container_name: picopark-grafana
    ports:
      - "3030:3000"   # 3000, 3003, 3010 y 3040 ya están ocupados en la VM
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Viene del secreto de GitHub. Grafana solo la usa al crear su base la primera vez,
      # así que los comandos manuales (ps, logs) funcionan aunque la variable no esté definida.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"   # no descargar plugins que no usamos (Tempo, Loki, CloudWatch...)
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *logging

volumes:
  prometheus-data:
  grafana-data:
