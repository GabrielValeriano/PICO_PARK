services:
  juego:
    build: ./Juego
    image: gabrielvaleriano/picopark-juego:latest
    container_name: picopark-juego
    ports:
      - "4321:4321"
    restart: unless-stopped

  servidor:
    build: ./Servidor
    image: gabrielvaleriano/picopark-servidor:latest
    container_name: picopark-servidor
    ports:
      - "3002:3000"
    restart: unless-stopped
