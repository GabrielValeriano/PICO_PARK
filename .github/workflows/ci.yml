name: CI/CD - Build, Publicar y Desplegar

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependencias y verificar build/tests
        shell: bash
        run: |
          run_test_if_defined() {
            if bun -e 'const pkg = require("./package.json"); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)'; then
              bun run test
            else
              echo "Sin script test definido, se omite."
            fi
          }
          if [ -d "Juego" ] && [ -f "Juego/package.json" ]; then
            cd Juego && bun install
            bun run --if-present build
            run_test_if_defined
            cd ..
          fi
          if [ -d "Servidor" ] && [ -f "Servidor/package.json" ]; then
            cd Servidor && bun install
            bun run --if-present build
            run_test_if_defined
            bun x tsc --noEmit index.ts || true
            cd ..
          fi

      - name: Login en Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de imagen Juego
        uses: docker/build-push-action@v6
        with:
          context: ./Juego
          file: ./Juego/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/picopark-juego:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/picopark-juego:sha-${{ github.sha }}

      - name: Build y push de imagen Servidor
        uses: docker/build-push-action@v6
        with:
          context: ./Servidor
          file: ./Servidor/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/picopark-servidor:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/picopark-servidor:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, picopark-vm]   # runner instalado en la VM
    concurrency:
      group: deploy-vm                            # nunca dos deploys a la vez
      cancel-in-progress: false
    environment:
      name: produccion-vm
      url: http://10.56.31.44:4321

    steps:
      - name: Actualizar el repo en la VM (compose y script)
        working-directory: /opt/proyecto/PICO_PARK
        run: git pull --ff-only origin main

      - name: Login en Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Desplegar, verificar y rollback si falla
        working-directory: /opt/proyecto/PICO_PARK
        # Mismo tag que publica build-and-push: sha-<hash completo del commit>
        run: bash scripts/deploy.sh "sha-${GITHUB_SHA}"