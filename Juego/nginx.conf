server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Healthcheck del contenedor (no ensucia el log de accesos)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos generados por Astro: llevan hash en el nombre, se pueden cachear mucho tiempo
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
